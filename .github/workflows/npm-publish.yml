# Publishes the package to npmjs.org when a GitHub release is published.
# Uses npm trusted publishing (OIDC): link this repo/workflow under the
# package's "Trusted Publisher" settings on npmjs.com. No token needed.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment set on the npm trusted publisher
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Node 24: tests need node:module stripTypeScriptTypes (22.13+),
      # and trusted publishing needs a recent npm CLI.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # No dependency cache in release builds (npm recommendation)
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; don't rely on the runner's bundled npm
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" ] \
            || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version"; exit 1; }

      # prepack runs typecheck, tests and build
      # --loglevel verbose shows the OIDC token exchange if auth fails
      - run: npm publish --loglevel verbose
